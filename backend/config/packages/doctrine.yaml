doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Version du serveur dans DATABASE_URL (serverVersion=17)
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        dql:
            string_functions:
                # Recherche insensible aux accents (src/Controller/RechercheController.php)
                unaccent: App\Doctrine\Unaccent
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
