nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        # Le front (localhost:3000) envoie le cookie de session à l'API (localhost:8000)
        allow_credentials: true
        # À élargir quand des opérations PATCH ou DELETE seront exposées
        allow_methods: ['GET', 'POST', 'OPTIONS']
        allow_headers: ['Content-Type', 'Accept']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/': null
