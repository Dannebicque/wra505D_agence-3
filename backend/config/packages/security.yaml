security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    App\Entity\Users: 'auto'

  role_hierarchy:
    ROLE_ETUDIANT: [ ROLE_USER ]
    ROLE_ENSEIGNANT: [ ROLE_USER ]
    ROLE_ADMIN: [ ROLE_USER ]

  providers:
    app_user_provider:
      entity:
        class: App\Entity\Users
        property: username

  firewalls:
    dev:
      pattern: ^/_(profiler|wdt)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      # Connexion par identifiant et mot de passe ; la session est gardée dans un cookie HttpOnly
      json_login:
        check_path: api_login
        username_path: username
        password_path: password
        failure_handler: App\Security\LoginFailureHandler
      login_throttling:
        max_attempts: 5
        interval: '1 minute'
      logout:
        path: api_logout

  # La première règle qui correspond s'applique : tout /api exige une connexion, sauf la connexion elle-même
  access_control:
    - { path: ^/api/login$, roles: PUBLIC_ACCESS }
    - { path: ^/api/docs, roles: PUBLIC_ACCESS }
    # Synchro intranet : écrit en base, réservée aux admins
    - { path: ^/api/intranet, roles: ROLE_ADMIN }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      # By default, password hashers are resource intensive and take time. This is
      # important to generate secure password hashes. In tests however, secure hashes
      # are not important, waste resources and increase test times. The following
      # reduces the work factor to the lowest possible values.
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon

