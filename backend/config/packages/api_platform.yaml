api_platform:
    title: API UniFolio
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        # Authentification par cookie de session (json_login) : l'API n'est pas sans état
        stateless: false
        # Même taille de page que le front (ITEMS_PER_PAGE de server/utils/hydra.ts)
        pagination_items_per_page: 30
        # Le contrat du front (shared/types) déclare les champs nullables toujours présents
        normalization_context:
            skip_null_values: false
        # Identifiant entier entre 1 et 2147483647 (entier PostgreSQL) : au-delà, la route ne correspond pas (404)
        # au lieu d'une erreur 500 « Numeric value out of range » ; vaut aussi pour une IRI dans un corps de requête.
        # Chiffres latins seulement et sans zéro de tête : une seule adresse par ressource (pas de /01 ni de /1٣).
        requirements:
            id: '[1-9][0-9]{0,8}|1[0-9]{9}|20[0-9]{8}|21[0-3][0-9]{7}|214[0-6][0-9]{6}|2147[0-3][0-9]{5}|21474[0-7][0-9]{4}|214748[0-2][0-9]{3}|2147483[0-5][0-9]{2}|21474836[0-3][0-9]|214748364[0-7]'
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

when@prod:
    api_platform:
        enable_docs: false
        enable_entrypoint: false
        enable_swagger: false
        enable_swagger_ui: false
