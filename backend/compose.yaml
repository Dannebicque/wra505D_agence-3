services:
  php:
    build:
      context: .
      target: dev
    environment:
      # Sous Windows (volume monté lent), le cache:clear de Composer dépasse sa limite de 300 s et arrête le conteneur
      COMPOSER_PROCESS_TIMEOUT: "0"
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unifolio
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "unifolio", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
