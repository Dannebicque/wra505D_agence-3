# Production : docker compose -f compose.prod.yaml up -d --build (variables dans un fichier .env.prod, voir README).
# L'API écoute sur le port 80 du conteneur, derrière le reverse proxy HTTPS de l'hébergement (ou le front Nuxt,
# qui relaie /api/**). Aucun code n'est monté : tout est dans l'image (cible prod du Dockerfile).
services:
  php:
    build:
      context: .
      target: prod
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET obligatoire}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@database:5432/${POSTGRES_DB:-unifolio}?serverVersion=17&charset=utf8
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN obligatoire}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      API_KEY: ${API_KEY:-}
      MAILER_DSN: ${MAILER_DSN:-null://null}
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      # Fichiers des traces : à sauvegarder avec la base (fiches en base, contenu ici)
      - fichiers:/app/var/fichiers/prod
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unifolio}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    # Pas de port publié : la base n'est joignable que par l'API
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
  fichiers:
